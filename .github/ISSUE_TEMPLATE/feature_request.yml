name: Feature Request
description: Suggest a new feature
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: "Thanks for the suggestion! Please describe the feature."
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve?
      placeholder: "I'm frustrated that..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How should it work?
      placeholder: "Add a flag..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      placeholder: "Other approaches considered..."
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Hardware detection
        - Model catalog / scoring
        - CLI / TUI
        - Web dashboard
        - API / lib
        - Docs
        - CI/CD
      multiple: true
  - type: checkboxes
    id: willingness
    attributes:
      label: Contribution
      options:
        - label: I can implement this
        - label: I can test this
        - label: I can write docs
