name: CI

on:
  push:
    branches:
      - main
    paths:
      - 'llmfit-*/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
  pull_request:
    branches:
      - main
    paths:
      - 'llmfit-*/**'
      - 'Cargo.lock'
      - 'Cargo.toml'
    types:
      - opened
      - synchronize
      - reopened

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: llmfit-web/package-lock.json

      - name: Build web dashboard assets
        run: |
          cd llmfit-web
          npm ci
          npx vite build

      - name: Run web unit tests
        run: |
          cd llmfit-web
          npx vitest run

      - uses: Swatinem/rust-cache@v2

      - name: Run Rust tests
        run: cargo test -p llmfit-x-core -p llmfit-x

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: llmfit-web/package-lock.json

      - name: Build web dashboard assets
        run: |
          cd llmfit-web
          npm ci
          npm run build

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy -p llmfit-x-core -p llmfit-x --all-targets
